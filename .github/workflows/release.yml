name: Automatic Release

on:
  push:
    branches:
      - main
    paths:
      - 'ssh-notify.sh'
      - 'ssh-notify.conf.template'
      - 'ssh-notify.sudoers'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssh-notify-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          shellcheck ssh-notify.sh tests/security-test.sh
          ./ssh-notify.sh --self-test
          sudo ./tests/security-test.sh
          git diff --check HEAD^ HEAD

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -z "$latest_tag" ]]; then
            next_version="v1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            commit_messages="$(git log --format=%B "${latest_tag}..HEAD")"

            # A functional change creates a minor release by default. Inspect
            # all commits since the last tag so merge commits do not hide an
            # explicit patch or breaking-change marker.
            if grep -Eqi '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]*\))?!:|\[major\]' <<< "$commit_messages"; then
              major=$((major + 1))
              minor=0
              patch=0
            elif grep -Eqi '(^|[[:space:]])fix(\([^)]*\))?:|\[patch\]' <<< "$commit_messages"; then
              patch=$((patch + 1))
            else
              minor=$((minor + 1))
              patch=0
            fi

            next_version="v${major}.${minor}.${patch}"
          fi

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Next release: $next_version"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            ssh-notify.sh \
            ssh-notify.conf.template \
            ssh-notify.sudoers
